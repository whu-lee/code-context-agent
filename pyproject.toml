[project]
name = "code-context-agent"
version = "1.0.0"
description = "MVP semantic context server for Java + Protobuf RPC repositories."
requires-python = ">=3.9"
dependencies = []
readme = "README.md"
authors = [{ name = "lishishun" }]
keywords = ["java", "protobuf", "rpc", "code-understanding", "knowledge-graph"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]

[project.scripts]
codeagent = "codeagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
